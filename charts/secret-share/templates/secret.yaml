apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "secret-share.labels" . | nindent 4 }}
type: Opaque
stringData:
  PORT: {{ .Values.service.port | quote }}
  {{- if .Values.persistence.enabled }}
  DB_PATH: /data/secret_share.redb
  {{- end }}
  {{- if and .Values.ingress.enabled (not .Values.env.BASE_URL) }}
  BASE_URL: {{ printf "https://%s" .Values.ingress.host | quote }}
  {{- end }}
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
